services:
  - type: web
    name: atlas-chatbot-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npm run prisma:migrate:deploy && node dist/init-production.js && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LOCAL_MODE
        value: "true"

databases:
  - name: atlas-db
    databaseName: atlas_prod
    user: atlas_user
    region: oregon
    plan: free
