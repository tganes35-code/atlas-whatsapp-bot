services:
  - type: web
    name: atlas-whatsapp-bot-api
    runtime: node
    plan: free
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm run start:prod"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: "atlas-verify-token"
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: LOCAL_MODE
        value: "false"
      - key: CORS_ORIGIN
        value: "https://atlas-whatsapp-bot-web.onrender.com"
    healthCheckPath: /api/auth/login
    staticPublishPath: ./backend/dist

  - type: web
    name: atlas-whatsapp-bot-web
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview"
    envVars:
      - key: VITE_API_URL
        value: "https://atlas-whatsapp-bot-api.onrender.com/api"
    staticPublishPath: ./frontend/dist

  - type: pserv
    name: atlas-postgres
    plan: free
    ipAllowList: []
    version: "16"
    primaryRegion: oregon
    databaseName: atlas_db
    username: atlas
    preDeployCommand: "cd backend && npx prisma migrate deploy && npx prisma db seed"
