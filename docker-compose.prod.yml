services:
  db:
    image: postgres:16-alpine
    container_name: atlas-db
    environment:
      POSTGRES_DB: atlas_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-backend
    environment:
      DATABASE_URL: "postgresql://atlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/atlas_db?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"
      NODE_ENV: "production"
      PORT: "3000"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:?Set WHATSAPP_ACCESS_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:?Set WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:?Set WHATSAPP_APP_SECRET}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:?Set WHATSAPP_VERIFY_TOKEN}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "gpt-4o-mini"
      LOCAL_MODE: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
